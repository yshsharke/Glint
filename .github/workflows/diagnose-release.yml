name: Diagnose release
on:
  push:
    paths: ['.github/workflows/diagnose-release.yml']
permissions:
  actions: read
jobs:
  read-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Surface failed package check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/yshsharke/Glint/actions/jobs/105502450450/logs -o failed.log
          message="$(tail -n 90 failed.log)"
          message="${message//'%'/'%25'}"
          message="${message//$'\r'/'%0D'}"
          message="${message//$'\n'/'%0A'}"
          printf '::notice::%s\n' "$message"
