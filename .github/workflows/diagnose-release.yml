name: Diagnose release
on:
  push:
    paths: ['.github/workflows/diagnose-release.yml']
permissions:
  actions: read
jobs:
  read-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Surface failed package check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/yshsharke/Glint/actions/jobs/105502450450/logs -o failed.log
          tail -n 70 failed.log | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            printf '::notice::%s\n' "$line"
          done
