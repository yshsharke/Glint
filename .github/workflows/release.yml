name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package Windows x64
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: node -e "const v=require('./package.json').version; if(process.env.REF_TYPE==='tag' && process.env.REF_NAME!=='v'+v) throw Error('Tag must match package.json version');"
      - run: npm ci
      - run: npm run setup:electron
      - run: npm run check
      - run: npm run package
      - run: npm run package:verify
      - run: npm run package:verify-installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Glint-*-windows-x64-portable.exe
            release/Glint-*-windows-x64-setup.exe
            release/SHA256SUMS.txt

  publish:
    name: Publish preview release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG#v}.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt \
            --verify-tag --draft --prerelease \
            --title "Glint $RELEASE_TAG · Preview" --notes-file "$notes"
          gh release edit "$RELEASE_TAG" --draft=false
