appId: com.yshsharke.glint
productName: Glint
copyright: Copyright © 2026 Glint contributors
directories:
  output: release
asar: true
npmRebuild: false
files:
  - dist/main.cjs
  - dist/preload.cjs
  - dist/selection-host.cjs
  - dist/renderer.js
  - dist/index.html
  - dist/styles.css
  - dist/icons.css
  - dist/icon-catalog.js
  - dist/icons/*.svg
  - dist/brand/**
  - dist/licenses/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - '!node_modules/selection-hook/prebuilds/{darwin-*,linux-*,win32-arm64}/**'
  - '!node_modules/selection-hook/build/**'
  - '!node_modules/selection-hook/glint-native.json'
asarUnpack:
  - node_modules/selection-hook/**
  - node_modules/node-gyp-build/**
win:
  executableName: Glint
  icon: dist/brand/glint.ico
  requestedExecutionLevel: asInvoker
  signExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Glint-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Glint
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerLanguages: [en_US, zh_CN]
  displayLanguageSelector: true
portable:
  artifactName: Glint-${version}-windows-${arch}-portable.${ext}
  requestExecutionLevel: user
  unpackDirName: false
